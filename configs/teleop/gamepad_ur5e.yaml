# Xbox 手柄 -> UR5e 真机(经虚拟位姿,单右臂)。
# 速度语义: 满偏 = configs/gamepad.yaml 的 lin_speed/rot_speed(默认 0.15m/s / 0.8rad/s),
# 再经 configs/ur5e.yaml 安全层(每拍步长/工作空间盒/偏差钳位)限幅。
# 方向不对用 teleop_record.py --calibrate 键 1-6 翻符号,s 存回本文件。
device: gamepad
engage_threshold: 0.9
save_button: B
discard_button: A
arms:
  right:
    side: right
    pos_scale: 1.0
    rot_scale: 1.0
    pos_sign: [1.0, 1.0, 1.0]
    rot_sign: [1.0, 1.0, 1.0]

# 自制末端执行器通道(可选)。去掉 "# " 启用;每项 = 一路舵机,顺序 = 舵机编号。
# source 填手柄的备用输入名(默认布局可用: y / rb / back / start / guide /
# ls_click / rs_click / dpad_y,见 configs/gamepad.yaml),或 [正向名, 负向名] 一对。
# mode: hold=按住即到位  rate=按住/推杆按 speed(每秒走的量程比例)慢慢走  toggle=按一下切换
# actuators:
#   - {source: <备用输入名>, mode: toggle, init: 0.0}
#   - {source: [<正向输入名>, <负向输入名>], mode: rate, speed: 0.5, init: 0.5}
