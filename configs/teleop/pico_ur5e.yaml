# Pico Ultra 4 -> UR5e 真机(scripts/auto_calibrate_ur5e.py 自动标定写入)
# world_yaw_deg = 头显世界系->基座系的水平对齐角, 跟操作员站位/app 启动朝向绑定,
# 换站位或重启头显 app 后需要重标!
device: pico_ultra4
engage_threshold: 0.9
save_button: B
discard_button: A
arms:
  right:
    side: right
    pos_scale: 0.8
    rot_scale: 1.0
    pos_sign: [1.0, 1.0, 1.0]
    rot_sign: [1.0, 1.0, -1.0]
    world_yaw_deg: 136.2

# 自制末端执行器通道(可选)。去掉 "# " 启用;每项 = 一路舵机,顺序 = 舵机编号。
# source 填手柄的备用输入名(右手柄: right_axis_x / right_axis_y / right_axis_click;
# 左手柄: x / y / left_grip / left_trigger / left_axis_x / left_axis_y / left_axis_click),
# 或 [正向名, 负向名] 一对。标定脚本重写本文件时会原样保留这一块。
# mode: hold=直接跟随输入  rate=输入当速度,每秒走 speed×输入(量程 0..1)  toggle=按一下切换
# actuators:
#   - {source: <备用输入名>, mode: toggle, init: 0.0}
#   - {source: <摇杆轴名>, mode: rate, speed: 0.5, init: 0.5}
