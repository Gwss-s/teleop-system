# Pico Ultra 4 -> LIBERO / robomimic (single right arm, robosuite OSC bridge).
# Calibrated (all 6 axes verified against the Panda EE):
#   * position mirrored through the y-z plane (agentview camera faces the robot)
#     -> pos_sign flips world x; axis-angle (pseudovector) transforms as
#     (wx,wy,wz)->(wx,-wy,-wz) for a consistent mirror -> rot_sign (1,-1,-1).
# DO NOT change signs without re-running envs/libero/teleop_test.py.
device: pico_ultra4
engage_threshold: 0.9   # official XRoboToolkit sample: active = grip > 0.9
save_button: B          # episode verdict: keep
discard_button: A       # episode verdict: void
arms:
  right:
    side: right         # which controller drives this arm
    pos_scale: 4.0      # hand motion gain (metric in -> metric EE target out)
    rot_scale: 2.0      # rotation gain
    pos_sign: [-1.0, 1.0, 1.0]
    rot_sign: [1.0, -1.0, -1.0]
