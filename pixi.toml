# teleop-system 环境清单(pixi)
# 用法(新机器):
#   curl -fsSL https://pixi.sh/install.sh | bash     # 装 pixi(一次)
#   cd teleop-system && pixi install                 # 核心+UR5e 环境(含 ur_rtde)
#   pixi run test                                    # 跑全部单测验证安装
#   pixi shell                                       # 进入环境(PYTHONPATH 已配好)
# LIBERO 仿真(重依赖,可选):
#   pixi install -e sim
#   pixi run -e sim install-libero                   # 拉 LIBERO-plus 并 pip -e(含 torch,较大)
# Pico SDK/PC Service 的手动安装见 docs/pico_teleop_setup.md。

[workspace]
name = "teleop-system"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT"          # unix 语法;win 见 target.win-64

[target.win-64.activation.env]
PYTHONPATH = "%PIXI_PROJECT_ROOT%"         # Windows(cmd)变量语法,pixi 官方要求

[dependencies]
python = "3.10.*"
numpy = ">=1.24"
pyyaml = "*"
pip = "*"

[pypi-dependencies]
ur-rtde = ">=1.6.5,<2"       # UR5e 控制(RTDEControl/Receive/Dashboard)
opencv-python = "*"          # HUD 窗口/相机录制
pygame = ">=2.1"             # Xbox 手柄后端(backends/gamepad.py)

[tasks]
test = "python tests/test_teleop_equivalence.py && python tests/test_ur5e_adapter.py && python tests/test_gamepad_backend.py"
ur5e = "python envs/ur5e/teleop_record.py"          # pixi run ur5e -- --dry-run ...
demo = "python envs/ur5e/teleop_record.py --dry-run --backend replay --tap tests/data/sample_tap.npz --fast --no-gui"  # 零硬件数据流演示

[feature.sim]
platforms = ["linux-64"]     # robosuite/LIBERO 官方仅支持 Linux/macOS,不在 win 求解

[feature.sim.pypi-dependencies]
robosuite = "==1.4.1"
mujoco = "==3.1.6"

[feature.sim.tasks]
install-libero = "test -d ../LIBERO-plus || git clone https://github.com/sylvestf/LIBERO-plus.git ../LIBERO-plus; pip install -e ../LIBERO-plus"

[environments]
default = { solve-group = "main" }
sim = { features = ["sim"], solve-group = "main" }
